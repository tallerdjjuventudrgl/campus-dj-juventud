<script>
/* ===================== CAMPUS VIRTUAL · TALLER DE DJ =====================
   Versión 2.0 — Vercel Pro + Turso Scaler (libSQL Serverless Edge)
   SISTEMAS DesarrollAR · Río Gallegos, Santa Cruz, Argentina 🇦🇷
========================================================================= */

const SETUP = new URLSearchParams(location.search).get("setup") === "1";
let authToken = localStorage.getItem("cursodj_token") || null;

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (authToken) headers["Authorization"] = "Bearer " + authToken;
  const res = await fetch(path, { credentials: "include", ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || ("Error " + res.status));
  }
  return data;
}

/* ---------- COURSE CONTENT (estático) ---------- */
const COURSE = {id:"dj", title:"Taller de DJ", modules:[
 {id:1,title:"Introducción y Digging",color:"#00a99d",icon:"🎵",lessons:[
   {id:"1a",title:"La Evolución del Rol del DJ",body:"El DJ dejó de ser quien «pone canciones». Hoy sos un arquitecto de la energía: elegís, intervenís y reconstruís la música en vivo para que una sala respire al ritmo que vos marcás.",tip:"Tu valor no está en tener los hits de moda, sino en el orden y el momento en que los soltás.",terms:["Selector","Remezclador","Open Format"]},
   {id:"1b",title:"Curaduría Extrema (Digging)",body:"«Digging» (excavar) es el arte de buscar esas gemas que el resto no tiene. Escuchar mucho, guardar con criterio y construir una biblioteca con identidad. El criterio se entrena hasta detectar qué tema va a funcionar antes de probarlo.",tip:"Por cada 10 temas que escuchás, quizá 1 entra a tu colección. Calidad sobre cantidad.",terms:["Digging","Gema musical","Criterio"]},
   {id:"1c",title:"Software: VDJ, Serato y Rekordbox",body:"Cada software es una herramienta para un trabajo. Virtual DJ y Serato brillan en Open Format por su agilidad; Rekordbox es el estándar para preparar tu biblioteca y tocar en cabinas profesionales con CDJs.",tip:"Dominá UNO a fondo antes de saltar a tres a medias.",terms:["Open Format","CDJ","Biblioteca"]},
   {id:"1d",title:"Tecnología Stems",body:"Los Stems separan una canción en sus capas —voz, batería, bajo, instrumentos— en tiempo real. Podés sacar la voz de un tema y montarla sobre la base de otro, creando mashups y versiones únicas en vivo.",tip:"Usá los Stems con intención. Sacar el bajo de la pista saliente evita que choque con la entrante.",terms:["Stem","Mashup","Acapella"]},
   {id:"1e",title:"Record Pools y Descarga",body:"Los «Record Pools» son bibliotecas por suscripción para DJs, con versiones extended e intros limpias. Beatport, SoundCloud, Soulseek. Tan importante como descargar es ordenar: carpetas por género, energía o evento.",tip:"Etiquetá tus archivos desde el día uno. A las 3 AM con la pista llena no es momento de tener caos.",terms:["Record Pool","Extended","Metadatos"]}
 ]},
 {id:2,title:"Ritmos y Mezcla",color:"#e6007e",icon:"🥁",lessons:[
   {id:"2a",title:"La Regla del 4/4",body:"Casi toda la música de baile está en 4/4: cuatro pulsos marcados por el bombo. Los pulsos se agrupan en compases, y los compases en «frases» de 8, 16 o 32 tiempos. Entender esto es como aprender a leer.",tip:"Contá 1-2-3-4 siguiendo el bombo. Si anticipás dónde arranca una frase nueva, ya pensás como DJ.",terms:["Pulso","Compás","Frase de 32"]},
   {id:"2b",title:"BPM y Beatmatching",body:"El BPM mide la velocidad de un tema. Para mezclar sin que «tropiecen», sus ritmos deben coincidir: eso es beatmatching. Lo aprendés con sync automático y, sobre todo, de forma instintiva con el oído y el Pitch-Bend.",tip:"El Sync es muleta; el oído es músculo. Practicá igualar a mano: si falla la tecnología, vos no fallás.",terms:["BPM","Beatmatching","Pitch-Bend"]},
   {id:"2c",title:"Ruleta de Camelot (Mezcla Armónica)",body:"Dos temas pueden estar perfectos de ritmo y sonar mal: el problema es la tonalidad. La mezcla armónica combina canciones en tonos compatibles, y la Ruleta de Camelot traduce la teoría a números y letras simples.",tip:"Mezclá hacia tonos vecinos (mismo número o ±1). Subir de tono da energía; mantenerlo, fluidez.",terms:["Tonalidad","Camelot","Armonía"]},
   {id:"2d",title:"Versiones Extended vs. Radio",body:"La versión de radio va al grano. La Extended agrega intro y outro de percusión pensados para el DJ: te dan tiempo para mezclar sin apuro. Preferir las extended te facilita la vida en la cabina.",tip:"Buscá siempre la versión extended o «club mix». Esos 16 compases de intro son tu zona de aterrizaje.",terms:["Radio Edit","Extended","Intro/Outro"]}
 ]},
 {id:3,title:"Transiciones y Creatividad",color:"#f39200",icon:"🎛️",lessons:[
   {id:"3a",title:"Estructura de la Canción",body:"Toda pista tiene partes: intro, desarrollo, drop, break (bajada) y outro. Reconocerlas te dice dónde entrar y salir. La mezcla perfecta hace que el inicio de una frase caiga en la bajada de la pista que se va.",tip:"El break de una canción es la puerta de entrada de la próxima. Entrená el oído para anticipar bajadas.",terms:["Intro","Drop","Break","Outro"]},
   {id:"3b",title:"Loops y Sampler",body:"Un loop es un bucle: tomás 4 tiempos de percusión y los repetís. Clave para cumbia, reggaetón o ritmos latinos que casi no tienen intro. El sampler dispara efectos y frases sobre la marcha.",tip:"Un loop de batería bien usado te «compra» tiempo: extendés una salida o armás una intro donde no la había.",terms:["Loop","Bucle","Sampler"]},
   {id:"3c",title:"El Mixer: EQ, Crossfader y Fader",body:"El mixer es tu mesa de control. La EQ separa graves, medios y agudos; el fader controla volumen; el crossfader cruza pistas. Regla de oro: nunca dos graves (sub-256 Hz) al mismo tiempo.",tip:"Al entrar un tema, bajá su grave a cero y subílo recién cuando saques el de la pista saliente.",terms:["EQ","Crossfader","Rango dinámico"]},
   {id:"3d",title:"Creatividad: Efectos y Filtros",body:"Los efectos son sal y pimienta: con criterio elevan; en exceso arruinan. El down filter con ruido blanco conecta un clímax con una intro tranquila. En este tema grabás tu primer mini set de 5 canciones.",tip:"Un efecto bien puesto se nota poco y se siente mucho. Si el público mira la cabina confundido, te pasaste.",terms:["Filtro","Down Filter","Ruido blanco"]}
 ]},
 {id:4,title:"Hardware y Audio",color:"#fbba00",icon:"🔊",lessons:[
   {id:"4a",title:"Conexiones y Señal de Audio",body:"Antes de sonar bien, conectar bien. Cables (RCA, XLR, jack), salidas y calibrado de niveles para cuidar la relación señal/ruido. Saturar la señal es el error más común y el que peor suena.",tip:"Niveles en verde, picos en amarillo, nunca clavados en rojo. El rojo es distorsión, no «más fuerte».",terms:["Señal/ruido","Gain","Saturación"]},
   {id:"4b",title:"Consolas vs. Controladores",body:"Un controlador depende de tu compu; una consola profesional (Pioneer CDJ + mixer) es autónoma y es lo que hay en clubes. Conocer ambos te vuelve versátil y no te paraliza frente a una cabina pro.",tip:"Los CDJ son el idioma universal de las cabinas del mundo. Familiarizarte abre puertas en cualquier lado.",terms:["Controlador","CDJ","Mixer"]},
   {id:"4c",title:"Psicología de la Pista",body:"Tocar es leer personas. Una pista vacía, un cumple de 15 o un after no se musicalizan igual. Observás cómo se mueven, qué piden, cuándo van a la barra, y respondés con tu selección.",tip:"Si la pista baila, no la «arregles». Si se vacía, cambiá de energía antes de que sea tarde.",terms:["Lectura de pista","Energía","Contexto"]},
   {id:"4d",title:"Franjas Horarias del Evento",body:"Una noche tiene actos: Opening, Warm-Up, Main y Closing. Cada franja pide una energía distinta. Reventar los hits a las 23 hs deja la noche sin recorrido; dosificar separa al pro del principiante.",tip:"Si abrís, tu trabajo NO es llenar la pista: es preparar el terreno. Tocar «menos» también es un arte.",terms:["Opening","Warm-Up","Main","Closing"]}
 ]},
 {id:5,title:"Práctica y Experiencia",color:"#0f8a7e",icon:"🎤",lessons:[
   {id:"5a",title:"Pasantía en Eventos Municipales",body:"La teoría se consolida tocando ante gente real: como DJ o asistente técnico en eventos de la Municipalidad de Río Gallegos. Es la diferencia entre saber andar en bici y andar de verdad.",tip:"En tu primer evento: llegá temprano, mirá cómo arma el técnico y preguntá todo. La humildad acelera.",terms:["Pasantía","Asistente técnico","En vivo"]},
   {id:"5b",title:"Ciclos de la Casa de la Juventud",body:"La Casa de la Juventud es tu primer escenario y tu red. Musicalizás encuentros juveniles, talleres y ciclos culturales, ante públicos y géneros variados.",tip:"Aprovechá para arriesgar: es el lugar ideal para probar esa mezcla rara antes de un evento grande.",terms:["Ciclo cultural","Encuentro juvenil"]},
   {id:"5c",title:"Encuentros Comunitarios",body:"Milongas, ferias y eventos barriales enseñan a adaptarte: públicos de todas las edades, géneros que no son tu fuerte, condiciones imperfectas. Salir de tu zona de confort te hace un DJ completo.",tip:"El que se adapta a una feria el sábado y a un after el domingo, no para nunca.",terms:["Versatilidad","Público diverso"]},
   {id:"5d",title:"Acompañamiento Docente",body:"Nunca estás solo. En cada presentación hay un instructor que guía, corrige y da devoluciones. Equivocarte con red es la mejor forma de crecer.",tip:"Pedí feedback específico: no «cómo estuve» sino «¿cómo manejé la transición del minuto 20?».",terms:["Feedback","Devolución","Mentoría"]}
 ]},
 {id:6,title:"Proyecto Final",color:"#b30062",icon:"⭐",lessons:[
   {id:"6a",title:"Grabación de tu Set",body:"Tu proyecto final es un set grabado de principio a fin: tu carta de presentación. Juntás todo lo aprendido en una pieza coherente que cuenta una historia.",tip:"Pensá tu set como un viaje, con comienzo, pico y cierre. No son 30 hits seguidos: es un recorrido.",terms:["Set","Tracklist","Grabación"]},
   {id:"6b",title:"Identidad Sonora",body:"¿Qué te hace VOS y no cualquier DJ? Tu identidad sonora es tu sello: géneros, transiciones típicas, energía. No se copia ni se compra: se construye tocando y descubriendo qué te emociona.",tip:"Escuchá a tus DJs favoritos para aprender, no para clonar. Tu firma aparece cuando dejás de imitar.",terms:["Sello","Estilo","Firma"]},
   {id:"6c",title:"Manejo de Marca Personal",body:"Un DJ también gestiona su presencia: redes, nombre artístico, cómo te mostrás. Lo básico para conseguir fechas y construir reputación. El talento abre la puerta; la actitud profesional te mantiene.",tip:"Tu reputación se construye con cosas simples: llegar a horario, cuidar el equipo ajeno y cumplir.",terms:["Nombre artístico","Reputación","Networking"]},
   {id:"6d",title:"Evaluación Final",body:"El cierre es una presentación ante instructores y compañeros. No se evalúa solo la técnica, sino tu evolución: creatividad, prolijidad, manejo del rango sonoro y responsabilidad.",tip:"No busques el set «perfecto»: mostrá todo lo que aprendiste. Se premia el progreso, no la ausencia de errores.",terms:["Evaluación","Progreso","Cierre"]}
 ]}
]};

/* ---------- STORE ---------- */
const store={ user:null, profile:null, assignments:[], submissions:[], comments:[], announcements:[], progress:{}, students:[], allProgress:[], allUsers:[], attendance:{sessions:[],records:[]}, certificates:[], storageMode:"turso_edge" };
let state={ route:{name:"login"} };

/* ---------- HELPERS ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>{ if(!d)return"-"; const x=new Date(d); return x.toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"}); };
const fmtSize=b=>!b?"":(b>1048576?(b/1048576).toFixed(1)+" MB":(b/1024).toFixed(0)+" KB");
const fmtTime=sec=>{ const s=Math.max(0,Math.floor(+sec||0)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const lessonsAll=()=>COURSE.modules.flatMap(m=>m.lessons);
const subFor=(aid,sid)=>store.submissions.find(s=>s.assignment_id===aid && s.student_id===sid);
const doneCountFor=id=>{ if(store.profile&&store.profile.role!=="student") return store.allProgress.filter(p=>p.user_id===id).length; return Object.keys(store.progress).length; };
const progressPct=id=>Math.round(doneCountFor(id)/lessonsAll().length*100);
const dueBadge=due=>{ const days=Math.ceil((new Date(due)-Date.now())/86400000); if(days<0) return '<span class="badge" style="background:rgba(239,68,68,.15);color:#f87171">Vencida</span>'; if(days<=3) return '<span class="badge" style="background:rgba(251,186,0,.15);color:var(--yellow)">Vence en '+days+'d</span>'; return '<span class="badge" style="background:rgba(0,169,157,.13);color:var(--cyan)">'+fmtDate(due)+'</span>'; };
const initials=n=>(n||"?").split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase();
const studentAttPct=sid=>{
  const sess=store.attendance.sessions||[];
  if(!sess.length) return 100;
  const recs=(store.attendance.records||[]).filter(r=>r.student_id===sid&&(r.status==="present"||r.status==="late"||r.status==="excused"));
  return Math.min(100,Math.round(recs.length/sess.length*100));
};
const studentAvgGrade=sid=>{
  const graded=store.submissions.filter(s=>s.student_id===sid&&s.status==="graded"&&s.grade!=null);
  if(!graded.length) return null;
  return +(graded.reduce((a,b)=>a+(+b.grade),0)/graded.length).toFixed(1);
};

/* ---------- HYBRID CLOUD UPLOADER (Cloudflare R2 Presigned + Turso Chunked Streamer) ---------- */
async function uploadMediaFile(file, folder, onProgress) {
  if(onProgress) onProgress(2, "Inicializando subida cloud…");
  const init = await api("/api/storage/init", {
    method: "POST",
    body: JSON.stringify({ file_name: file.name, file_type: file.type || "application/octet-stream", file_size: file.size, folder })
  });
  if (init.mode === "cloudflare_r2" && init.upload_url) {
    if(onProgress) onProgress(15, "Subiendo directo a Cloudflare R2…");
    const putRes = await fetch(init.upload_url, {
      method: "PUT",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file
    });
    if (!putRes.ok) throw new Error("Error subiendo a Cloudflare R2 (" + putRes.status + ")");
    if(onProgress) onProgress(100, "¡Archivo subido a Cloudflare R2!");
    return { url: init.public_url, file_id: init.file_id, mode: "cloudflare_r2" };
  }
  const CHUNK_SIZE = 750 * 1024;
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE) || 1;
  for (let idx = 0; idx < totalChunks; idx++) {
    const slice = file.slice(idx * CHUNK_SIZE, Math.min(file.size, (idx + 1) * CHUNK_SIZE));
    const b64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const res = String(r.result || "");
        resolve(res.includes(",") ? res.split(",")[1] : res);
      };
      r.onerror = reject;
      r.readAsDataURL(slice);
    });
    const pct = Math.round(((idx + 1) / totalChunks) * 95);
    if(onProgress) onProgress(pct, `Subiendo bloque ${idx+1}/${totalChunks} (${pct}%)…`);
    await api("/api/storage/chunk", {
      method: "POST",
      body: JSON.stringify({ file_id: init.file_id, chunk_index: idx, total_chunks: totalChunks, data_base64: b64 })
    });
  }
  if(onProgress) onProgress(100, "¡Subida completada!");
  return { url: init.public_url, file_id: init.file_id, mode: "turso_edge" };
}

/* ---------- DATA LOADERS (Turso Scaler) ---------- */
async function loadProfile(){
  if (!authToken) { store.user = null; store.profile = null; return null; }
  try {
    const data = await api("/api/auth/me");
    store.user = data.user;
    store.profile = data.profile;
    return data.profile;
  } catch (e) {
    store.user = null;
    store.profile = null;
    authToken = null;
    localStorage.removeItem("cursodj_token");
    return null;
  }
}
async function refresh(){
  if(!store.profile) return;
  const role=store.profile.role, uid=store.user.id;
  try {
    const [as, an, tl, subs, comms, att, certs, stCfg] = await Promise.all([
      api("/api/assignments"),
      api("/api/announcements"),
      api("/api/tools"),
      api("/api/submissions"),
      api("/api/submissions/comments").catch(()=>[]),
      api("/api/attendance").catch(()=>({sessions:[],records:[]})),
      api("/api/certificates").catch(()=>[]),
      api("/api/storage/config").catch(()=>({mode:"turso_edge"}))
    ]);
    store.assignments = as || [];
    store.announcements = an || [];
    store.tools = tl || [];
    store.submissions = subs || [];
    store.comments = comms || [];
    store.attendance = att || {sessions:[],records:[]};
    store.certificates = certs || [];
    store.storageMode = stCfg?.mode || "turso_edge";
    for(const s of store.submissions){ s.fileUrl = s.file_path || null; }

    if(role==="student"){
      const pr = await api("/api/progress");
      store.progress = {};
      (pr || []).forEach(p => store.progress[p.lesson_id] = true);
    }
    if(role==="instructor"||role==="admin"){
      const [progData, dl, instList] = await Promise.all([
        api("/api/progress"),
        api("/api/tools/downloads"),
        api("/api/instructors")
      ]);
      store.students = progData?.students || [];
      store.allProgress = progData?.progress || [];
      store.toolDownloads = dl || [];
      store.myCard = (instList || []).find(c => c.user_id === uid) || null;
    }
    if(role==="admin"){
      const au = await api("/api/admin/users");
      store.allUsers = au || [];
    }
  } catch(err) {
    console.error("Error refreshing data:", err);
  }
}

function authMsg(text,ok){ const el=document.getElementById("authMsg"); if(!el)return; el.textContent=text; el.className="text-sm mb-4 p-3 rounded-lg"; el.style.background=ok?"rgba(0,169,157,.12)":"rgba(239,68,68,.12)"; el.style.color=ok?"#5eead4":"#f87171"; el.classList.remove("hidden"); }
async function doLogin(){
  const userEl = document.getElementById("aUser") || document.getElementById("lUser");
  const pwEl = document.getElementById("aPw") || document.getElementById("lPw");
  if(!userEl || !pwEl){ authMsg("Error en el formulario de inicio de sesión."); return; }
  const user = userEl.value.trim().toLowerCase().replace(/\s+/g,"");
  const pw = pwEl.value;
  if(!user||!pw){authMsg("Completá usuario y contraseña.");return;}
  const btn=document.getElementById("authBtn");
  if(btn){ btn.disabled=true; btn.textContent="Ingresando…"; }
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ username: user, password: pw })
    });
    authToken = data.token;
    localStorage.setItem("cursodj_token", data.token);
    store.user = data.user;
    store.profile = data.profile;
    state.route = { name: "dashboard" };
    document.getElementById("app").innerHTML = loader("Cargando campus…");
    await refresh();
    render();
  } catch(err) {
    authMsg(err.message || "Usuario o contraseña incorrectos.");
    if(btn){ btn.disabled = false; btn.textContent = "Ingresar al campus"; }
  }
}
async function doSetup(){
  const user=document.getElementById("sUser").value.trim().toLowerCase().replace(/\s+/g,""), name=document.getElementById("sName").value.trim(), pw=document.getElementById("sPw").value;
  if(!user||!name){authMsg("Completá usuario y nombre.");return;}
  if(pw.length<6){authMsg("La contraseña debe tener al menos 6 caracteres.");return;}
  const btn=document.getElementById("authBtn"); btn.disabled=true; btn.textContent="Creando…";
  try {
    const data = await api("/api/auth/setup-admin", {
      method: "POST",
      body: JSON.stringify({ username: user, name, password: pw })
    });
    authToken = data.token;
    localStorage.setItem("cursodj_token", data.token);
    store.user = data.user;
    store.profile = data.user;
    state.route = { name: "dashboard" };
    document.getElementById("app").innerHTML = loader();
    await refresh();
    render();
  } catch(err) {
    authMsg(err.message || "Error al crear cuenta inicial.");
    btn.disabled = false;
    btn.textContent = "Crear mi cuenta";
  }
}
async function logout(){
  try { await api("/api/auth/logout", { method: "POST" }); } catch(_) {}
  authToken = null;
  localStorage.removeItem("cursodj_token");
  store.profile = null;
  store.user = null;
  state.route = { name: "login" };
  render();
}

async function toggleLesson(lid){
  try {
    const res = await api("/api/progress/toggle", { method: "POST", body: JSON.stringify({ lesson_id: lid }) });
    if(res.completed){ store.progress[lid] = true; } else { delete store.progress[lid]; }
  } catch(e) { alert("Error: " + e.message); }
  const open=[...document.querySelectorAll('.acc.open')].map(e=>e.id); render(); open.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('open');});
}

const CAT_COLORS={beatmatching:"#00a99d",eq:"#fbba00",armonia:"#e6007e",estructura:"#f39200",destacado:"#10b981",general:"#60a5fa"};

  const hasRubric=s.rubric_beatmatching!=null||s.rubric_harmony!=null||s.rubric_structure!=null||s.rubric_eq!=null;
  if(!hasRubric) return "";
  const axes=[
    {label:"🥁 Beatmatching & Tempo",val:s.rubric_beatmatching,color:"#00a99d"},

  ];
  return `<div class="grid sm:grid-cols-2 gap-3 my-4 p-4 rounded-xl" style="background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)">
    ${axes.map(x=>{

      return `<div>
        <div class="flex justify-between text-xs mb-1"><span class="text-gray-300 font-medium">${x.label}</span><span class="mono font-bold" style="color:${x.color}">${x.val!=null?v+'/10':'—'}</span></div>

}

  }
  const comms=(store.comments||[]).filter(c=>c.submission_id===s.id).sort((a,b)=>a.timestamp_sec-b.timestamp_sec);
  const myId=store.user?.id, isStaff=store.profile?.role!=="student";
  setTimeout(()=>initWaveCanvas(s.id),60);
  return `<div class="wave-box mt-3">
    <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
      <div class="flex items-center gap-2 min-w-0">
        <span class="badge" style="background:rgba(0,169,157,.16);color:#5eead4">🎧 Cabina Audio Stream</span>

function initWaveCanvas(sid){ drawWave(sid); }
function drawWave(sid){
  const cv=document.getElementById("cv-"+sid); if(!cv) return;
  const aud=document.getElementById("aud-"+sid);
  const ctx=cv.getContext("2d");
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const dur=(aud&&aud.duration&&isFinite(aud.duration))?aud.duration:180;
  const cur=aud?aud.currentTime:0;
  const pct=Math.min(1,Math.max(0,cur/dur));
  const wt=document.getElementById("wt-"+sid);
  if(wt) wt.textContent=fmtTime(cur)+" / "+fmtTime(dur);
  const tcInput=document.getElementById("tc-sec-"+sid);
  if(tcInput && document.activeElement!==tcInput && cur>0) tcInput.value=fmtTime(cur);

  let seed=0; for(let i=0;i<sid.length;i++) seed=(seed*31+sid.charCodeAt(i))%9973;
  const bars=96, bw=W/bars;
  for(let i=0;i<bars;i++){
    seed=(seed*1103515245+12345)&0x7fffffff;
    const amp=0.22+((seed%100)/100)*0.72*Math.sin((i/bars)*Math.PI*0.95+0.15);
    const bh=Math.max(6,amp*(H-14));
    const x=i*bw+1.5, y=(H-bh)/2;
    const played=(i/bars)<=pct;
    ctx.fillStyle=played?"#00a99d":"rgba(148,163,184,0.22)";
    ctx.fillRect(x,y,Math.max(2,bw-2.5),bh);
  }
  const comms=(store.comments||[]).filter(c=>c.submission_id===sid);
  comms.forEach(c=>{
    const mx=Math.min(W-4,Math.max(4,(c.timestamp_sec/dur)*W));
    ctx.fillStyle=CAT_COLORS[c.category]||"#e6007e";
    ctx.fillRect(mx-1.5,0,3,H);
    ctx.beginPath(); ctx.arc(mx,7,4.5,0,Math.PI*2); ctx.fill();
  });
}
function clickWave(ev,sid){
  const cv=document.getElementById("cv-"+sid), aud=document.getElementById("aud-"+sid);
  if(!cv||!aud) return;
  const rect=cv.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
  const dur=(aud.duration&&isFinite(aud.duration))?aud.duration:180;
  aud.currentTime=ratio*dur;
  const tcInput=document.getElementById("tc-sec-"+sid);
  if(tcInput) tcInput.value=fmtTime(aud.currentTime);
  drawWave(sid);
}
function seekAudio(sid,sec){
  const aud=document.getElementById("aud-"+sid);
  if(!aud) return;
  aud.currentTime=+sec||0;
  aud.play().catch(()=>{});
  drawWave(sid);
}
async function postTimeComment(sid){
  const secStr=(document.getElementById("tc-sec-"+sid)?.value||"").trim();
  const cat=document.getElementById("tc-cat-"+sid)?.value||"general";
  const body=(document.getElementById("tc-body-"+sid)?.value||"").trim();
  if(!body){ alert("Escribí el comentario para este marcador."); return; }
  let sec=0;
  if(secStr.includes(":")){ const p=secStr.split(":"); sec=(+p[0]||0)*60+(+p[1]||0); }
  else if(secStr){ sec=+secStr||0; }
  else { const aud=document.getElementById("aud-"+sid); if(aud) sec=Math.floor(aud.currentTime||0); }
  try{
    await api("/api/submissions/comments",{method:"POST",body:JSON.stringify({submission_id:sid,timestamp_sec:sec,category:cat,body})});
    await refresh(); render();
  }catch(e){ alert("Error: "+e.message); }
}
async function delTimeComment(cid){
  try{
    await api("/api/submissions/comments?id="+encodeURIComponent(cid),{method:"DELETE"});

  }catch(e){ alert("Error: "+e.message); }
}

async function addTool(){
  const cat=document.getElementById("htCat").value, title=document.getElementById("htTitle").value.trim(), desc=document.getElementById("htDesc").value.trim(), url=document.getElementById("htUrl").value.trim(), fi=document.getElementById("htFile");
  if(!title){ alert("Poné un título."); return; }
  const btn=document.getElementById("htBtn"); btn.disabled=true; btn.textContent="Guardando…";
  let meta={category:cat,title,description:desc||null,url:url||null};
  try{
    if(fi.files&&fi.files[0]){
      const f=fi.files[0];
      if(f.size > 120 * 1024 * 1024){
        alert("El archivo supera los 120 MB máximos permitidos.");
        btn.disabled=false; btn.textContent="Guardar recurso"; return;
      }
      const pw=document.getElementById("htProgWrap"), pt=document.getElementById("htProgTxt"), pp=document.getElementById("htProgPct"), pb=document.getElementById("htProgBar");
      if(pw) pw.classList.remove("hidden");
      const up = await uploadMediaFile(f, "tools", (pct, msg) => {
        if(pt) pt.textContent = msg;
        if(pp) pp.textContent = pct + "%";
        if(pb) pb.style.width = pct + "%";
      });
      meta.url = up.url; meta.file_path = up.url; meta.file_name=f.name; meta.file_size=f.size; meta.file_type=f.type;
    } else if(!url){ alert("Pegá un link o subí un archivo."); btn.disabled=false; btn.textContent="Guardar recurso"; return; }
    await api("/api/tools", { method: "POST", body: JSON.stringify(meta) });
    await go("herramientas",{cat});
  } catch(err) { alert("Error: "+err.message); btn.disabled=false; btn.textContent="Guardar recurso"; }
}

async function studentCheckin(codeArg){
  const code=(codeArg||(document.getElementById("attCodeIn")?.value||"")).trim().toUpperCase();
  if(!code){ alert("Ingresá el código de la clase."); return; }
  try{
    const res=await api("/api/attendance/checkin",{method:"POST",body:JSON.stringify({code})});
    alert("✅ ¡Presente registrado en «"+(res.session_title||code)+"»!");
    await refresh(); await go("asistencia");
  }catch(e){ alert(e.message||"Código inválido o cerrado."); }
}
async function createAttSession(){
  const title=document.getElementById("asTitle").value.trim(), mod=+document.getElementById("asMod").value, class_date=document.getElementById("asDate").value;
  if(!title){ alert("Poné el título de la clase."); return; }
  try{
    const r=await api("/api/attendance/session",{method:"POST",body:JSON.stringify({title,module_id:mod,class_date})});
    await refresh(); await go("asistencia",{sid:r.id});
  }catch(e){ alert("Error: "+e.message); }
}
async function toggleAttSession(id,active,rotate){
  try{
    await api("/api/attendance/session",{method:"PUT",body:JSON.stringify({id,active:!!active,rotate_code:!!rotate})});
    await refresh(); render();
  }catch(e){ alert("Error: "+e.message); }
}
async function delAttSession(id){
  if(!confirm("¿Eliminar esta sesión de asistencia?")) return;
  try{
    await api("/api/attendance/session?id="+encodeURIComponent(id),{method:"DELETE"});
    await refresh(); await go("asistencia");
  }catch(e){ alert("Error: "+e.message); }
}
async function markManualAtt(session_id,student_id,status){
  try{
    await api("/api/attendance/manual",{method:"POST",body:JSON.stringify({session_id,student_id,status})});
    await refresh(); render();
  }catch(e){ alert("Error: "+e.message); }
}

async function issueFromPreview(){

async function issueStudentCert(student_id,student_name,defGrade){

async function revokeCert(id){

}

const CAMELOT_DATA = [
  { num: 1,  a: { code: "1A",  note: "G#m / Abm", es: "Sol# menor", color: "#00d2b8" }, b: { code: "1B",  note: "B",   es: "Si Mayor",    color: "#00f0d4" } },

  { num: 5,  a: { code: "5A",  note: "Cm",        es: "Do menor",   color: "#f5b81c" }, b: { code: "5B",  note: "Eb",  es: "Mib Mayor",   color: "#ffca36" } },

  { num: 8,  a: { code: "8A",  note: "Am",        es: "La menor",   color: "#ec3478" }, b: { code: "8B",  note: "C",   es: "Do Mayor",    color: "#ff4f90" } },
  { num: 9,  a: { code: "9A",  note: "Em",        es: "Mi menor",   color: "#d438b8" }, b: { code: "9B",  note: "G",   es: "Sol Mayor",   color: "#ea52ce" } },
  { num: 10, a: { code: "10A", note: "Bm",        es: "Si menor",   color: "#9848e8" }, b: { code: "10B", note: "D",   es: "Re Mayor",    color: "#af63fa" } },
  { num: 11, a: { code: "11A", note: "F#m",       es: "Fa# menor",  color: "#5268f2" }, b: { code: "11B", note: "A",   es: "La Mayor",    color: "#6d82ff" } },
  { num: 12, a: { code: "12A", note: "C#m / Dbm", es: "Do# menor",  color: "#0ca6e8" }, b: { code: "12B", note: "E",   es: "Mi Mayor",    color: "#2bbdff" } }
];

let tapTimes = [];
let selectedCamelot = "8A";

function getCamelotInfo(code){
  const num = parseInt(code, 10) || 8;
  const letter = code.endsWith("B") ? "B" : "A";
  const row = CAMELOT_DATA.find(r => r.num === num) || CAMELOT_DATA[7];
  const cur = letter === "B" ? row.b : row.a;
  const prevNum = num === 1 ? 12 : num - 1;
  const nextNum = num === 12 ? 1 : num + 1;
  const boostNum = ((num + 1) % 12) + 1;
  const diagNum = letter === "A" ? prevNum : nextNum;
  const findKey = (n, l) => {
    const rw = CAMELOT_DATA.find(x => x.num === n);
    return l === "B" ? rw.b : rw.a;
  };
  return {
    current: cur,
    same: cur,
    up: findKey(nextNum, letter),
    down: findKey(prevNum, letter),
    relative: findKey(num, letter === "A" ? "B" : "A"),
    boost: findKey(boostNum, letter),
    diag: findKey(diagNum, letter === "A" ? "B" : "A")
  };
}

function selectCamelotKey(code){
  selectedCamelot = code;
  render();
}

function buildCamelotWheelSvg(selCode){
  const info = getCamelotInfo(selCode);
  const compatCodes = new Set([info.same.code, info.up.code, info.down.code, info.relative.code]);
  const boostCodes = new Set([info.boost.code, info.diag.code]);
  const cx = 210, cy = 210;
  const rOuter1 = 192, rOuter0 = 132;
  const rInner1 = 128, rInner0 = 70;

  const polar = (r, deg) => {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const wedgePath = (r0, r1, a0, a1) => {
    const [x0, y0] = polar(r1, a0);
    const [x1, y1] = polar(r1, a1);
    const [x2, y2] = polar(r0, a1);
    const [x3, y3] = polar(r0, a0);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r1} ${r1} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)} A ${r0} ${r0} 0 0 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z`;
  };

  let paths = "";
  CAMELOT_DATA.forEach((item, idx) => {
    // Place 12 at top (0 deg), 1 at 30 deg, etc. like a clock
    const centerDeg = (item.num % 12) * 30;
    const a0 = centerDeg - 14.2;
    const a1 = centerDeg + 14.2;

    // Outer ring (B - Major)
    const bCode = item.b.code;
    const bSel = bCode === selCode;
    const bComp = compatCodes.has(bCode);
    const bBoost = boostCodes.has(bCode);
    const bOpacity = bSel ? "1" : (bComp ? "0.92" : (bBoost ? "0.62" : "0.24"));
    const bStroke = bSel ? "#ffffff" : (bComp ? "#ffffff" : "rgba(255,255,255,0.12)");
    const bSw = bSel ? "3.2" : (bComp ? "2" : "1");
    const [bx, by] = polar((rOuter0 + rOuter1) / 2, centerDeg);

    paths += `<g class="cursor-pointer" onclick="selectCamelotKey('${bCode}')">
      <path d="${wedgePath(rOuter0, rOuter1, a0, a1)}" fill="${item.b.color}" fill-opacity="${bOpacity}" stroke="${bStroke}" stroke-width="${bSw}"/>
      <text x="${bx.toFixed(1)}" y="${(by - 4).toFixed(1)}" text-anchor="middle" fill="${bSel||bComp?'#05080c':'#f8fafc'}" font-size="13" font-weight="800" font-family="JetBrains Mono,monospace">${bCode}</text>
      <text x="${bx.toFixed(1)}" y="${(by + 11).toFixed(1)}" text-anchor="middle" fill="${bSel||bComp?'#0f172a':'#cbd5e1'}" font-size="9.5" font-weight="700">${item.b.note}</text>
    </g>`;

    // Inner ring (A - Minor)
    const aCode = item.a.code;
    const aSel = aCode === selCode;
    const aComp = compatCodes.has(aCode);
    const aBoost = boostCodes.has(aCode);
    const aOpacity = aSel ? "1" : (aComp ? "0.92" : (aBoost ? "0.62" : "0.24"));
    const aStroke = aSel ? "#ffffff" : (aComp ? "#ffffff" : "rgba(255,255,255,0.12)");
    const aSw = aSel ? "3.2" : (aComp ? "2" : "1");
    const [ax, ay] = polar((rInner0 + rInner1) / 2, centerDeg);

    paths += `<g class="cursor-pointer" onclick="selectCamelotKey('${aCode}')">
      <path d="${wedgePath(rInner0, rInner1, a0, a1)}" fill="${item.a.color}" fill-opacity="${aOpacity}" stroke="${aStroke}" stroke-width="${aSw}"/>
      <text x="${ax.toFixed(1)}" y="${(ay - 3).toFixed(1)}" text-anchor="middle" fill="${aSel||aComp?'#05080c':'#f8fafc'}" font-size="12" font-weight="800" font-family="JetBrains Mono,monospace">${aCode}</text>
      <text x="${ax.toFixed(1)}" y="${(ay + 10).toFixed(1)}" text-anchor="middle" fill="${aSel||aComp?'#0f172a':'#cbd5e1'}" font-size="8.5" font-weight="700">${item.a.note.split('/')[0].trim()}</text>
    </g>`;
  });

  return `<svg viewBox="0 0 420 420" class="w-full max-w-[390px] mx-auto select-none drop-shadow-2xl">
    <circle cx="${cx}" cy="${cy}" r="200" fill="#080b10" stroke="rgba(0,169,157,0.25)" stroke-width="1.5"/>
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="64" fill="#0b0f15" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="${cx}" y="${cy - 16}" text-anchor="middle" fill="#5eead4" font-size="9" font-family="JetBrains Mono,monospace" letter-spacing="1.5">LLAVE ACTIVA</text>
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" font-family="JetBrains Mono,monospace">${info.current.code}</text>
    <text x="${cx}" y="${cy + 27}" text-anchor="middle" fill="#fbba00" font-size="11" font-weight="700">${info.current.note}</text>
    <text x="${cx}" y="${cy + 41}" text-anchor="middle" fill="#94a3b8" font-size="9">${info.current.es}</text>
  </svg>`;
}

function triggerTapBpm(){
  const now = performance.now();
  if(tapTimes.length > 0 && (now - tapTimes[tapTimes.length - 1]) > 2800){
    tapTimes = [];
  }
  tapTimes.push(now);
  if(tapTimes.length > 12) tapTimes.shift();

  const valEl = document.getElementById("tapBpmVal");
  const genEl = document.getElementById("tapBpmGenre");
  const cntEl = document.getElementById("tapCountVal");
  const msEl  = document.getElementById("tapMsVal");
  if(cntEl) cntEl.textContent = tapTimes.length + (tapTimes.length === 1 ? " tap" : " taps");

  if(tapTimes.length >= 2){
    let sum = 0;
    for(let i = 1; i < tapTimes.length; i++) sum += (tapTimes[i] - tapTimes[i-1]);
    const avgMs = sum / (tapTimes.length - 1);
    const bpm = Math.round((60000 / avgMs) * 10) / 10;
    if(valEl) valEl.textContent = bpm.toFixed(1);
    if(msEl) msEl.textContent = "Intervalo: " + Math.round(avgMs) + " ms";
    let genre = "Tempo Libre";
    if(bpm >= 85 && bpm < 105) genre = "Reggaetón / Hip-Hop / RKT";
    else if(bpm >= 105 && bpm < 118) genre = "Indie Dance / Nu-Disco / Midtempo";
    else if(bpm >= 118 && bpm < 124) genre = "Deep House / Organic / Progressive";
    else if(bpm >= 124 && bpm <= 130) genre = "House / Tech House / Melodic Techno";
    else if(bpm > 130 && bpm <= 145) genre = "Techno / Peak Time / Hard Groove / Trance";
    else if(bpm > 160 && bpm <= 180) genre = "Drum & Bass / Jungle";
    if(genEl) genEl.textContent = "Estilo típico: " + genre;
    const bIn = document.getElementById("pitchBpmA");
    if(bIn) { bIn.value = bpm.toFixed(1); calcPitchDiff(); }
  }
}

function resetTapBpm(){
  tapTimes = [];
  const valEl = document.getElementById("tapBpmVal");
  const genEl = document.getElementById("tapBpmGenre");
  const cntEl = document.getElementById("tapCountVal");
  const msEl  = document.getElementById("tapMsVal");
  if(valEl) valEl.textContent = "—";
  if(genEl) genEl.textContent = "Esperando pulsaciones…";
  if(cntEl) cntEl.textContent = "0 taps";
  if(msEl) msEl.textContent = "Intervalo: — ms";
}

function calcPitchDiff(){
  const a = parseFloat(document.getElementById("pitchBpmA")?.value || "0");
  const b = parseFloat(document.getElementById("pitchBpmB")?.value || "0");
  const box = document.getElementById("pitchResultBox");
  if(!box || !a || !b || b <= 0) return;
  const pct = ((a - b) / b) * 100;
  const sign = pct > 0 ? "+" : "";
  const abs = Math.abs(pct);
  const range = abs <= 6 ? "±6% (Alta precisión)" : (abs <= 10 ? "±10%" : (abs <= 16 ? "±16%" : "WIDE (Cambio extremo)"));
  const warn = abs > 3.5 ? "⚠️ Supera ±3.5%: activá sí o sí Master Tempo / Key Lock." : "✅ Rango ideal para mezcla orgánica y armónica.";
  box.innerHTML = `<div class="text-xs text-gray-300">Ajuste de Pitch necesario en Deck B:</div>
    <div class="mono text-3xl font-extrabold text-teal-300 my-1">${sign}${pct.toFixed(2)}%</div>
    <div class="text-xs text-gray-300">Rango CDJ: <b>${range}</b> · ${warn}</div>`;
}

    case "material": content=viewMaterial(); break;

    case "gestion": content=viewGestion(); break;
    case "nuevaTarea": content=viewNuevaTarea(); break;
    case "entregas": content=viewEntregas(); break;
    case "asistencia": content=viewAsistencia(); break;
    case "certificados": content=viewCertificados(); break;
    case "alumnos": content=viewAlumnos(); break;
    case "anuncios": content=viewAnuncios(); break;
    case "usuarios": content=viewUsuarios(); break;
    case "herramientas": content=viewHerramientas(); break;
    case "nuevaHerramienta": content=viewNuevaHerramienta(); break;

}

(async()=>{
  document.getElementById("app").innerHTML=loader("Conectando al Campus…");
  if(SETUP){ render(); return; }
  const checkinParam = new URLSearchParams(location.search).get("checkin");
  if(checkinParam) sessionStorage.setItem("pending_checkin", checkinParam);
  const profile = await loadProfile();
  if(profile){
    state.route={name:"dashboard"};
    await refresh();
    const pendingCode = sessionStorage.getItem("pending_checkin");
    if(pendingCode && profile.role==="student"){
      sessionStorage.removeItem("pending_checkin");
      try {
        const r = await api("/api/attendance/checkin", { method: "POST", body: JSON.stringify({ code: pendingCode }) });

        await refresh();
      } catch(e) { alert("Aviso QR: " + e.message); }
    }
  }
  else state.route={name:"login"};
  render();
})();
